[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-task-board"
version = "0.6.1"
requires-python = ">=3.11"
# Runtime deps are pinned to exact versions: these flow into the signed,
# distributed installer, so the build must be reproducible and a compromised
# upstream release can't silently change what ships. Bump these deliberately
# (review the changelog / advisories), not implicitly. Last verified set below.
dependencies = [
  "pywin32==311",
  "pystray==0.19.5",
  "Pillow==12.2.0",
  "sounddevice==0.5.5",
  "numpy==2.4.6",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pywebview==6.2.1",
  "apscheduler==3.11.2",
  "windows-toasts==1.3.1",
  "tzlocal==5.3.1",
  "pycaw==20251023",
  "comtypes==1.4.16",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pyinstaller>=6.5", "pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32gui", "pystray", "sounddevice", "pycaw", "pycaw.pycaw", "comtypes", "comtypes.client", "windows_toasts"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
