[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-task-board"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pywin32>=306",
  "pystray>=0.19",
  "Pillow>=10.0",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "httpx>=0.27",
  "pydantic>=2.5",
  "pywebview>=5.0",
  "apscheduler>=3.10",
  "windows-toasts>=1.1.0",
  "tzlocal>=5.0",
  "pycaw>=20240210",
  "comtypes>=1.2",
  "python-dateutil>=2.8.2",
  "scipy>=1.11",
  "soxr>=0.3",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pyinstaller>=6.5", "pytest>=8", "jiwer>=3", "soundfile>=0.12"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32gui", "pystray", "sounddevice", "pycaw", "pycaw.pycaw", "comtypes", "comtypes.client", "windows_toasts"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call the real Gemini API (skipped without a key)"]
