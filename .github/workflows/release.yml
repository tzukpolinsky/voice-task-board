name: Build and release installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create venv and install Python deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e ".[dev]"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        run: .\build.ps1

      - name: Verify installer was produced
        run: |
          if (-not (Test-Path "installer\output\VoiceTaskBoardSetup.exe")) {
            Write-Error "Installer was not produced"
            exit 1
          }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTaskBoardSetup
          path: installer/output/VoiceTaskBoardSetup.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/VoiceTaskBoardSetup.exe
          generate_release_notes: true
