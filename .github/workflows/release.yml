name: Build and release installer

on:
  push:
    tags:
      # Match both 'v'-prefixed tags (v0.6.0) and bare semver tags (0.6.0).
      # Previously only 'v*' matched, so a bare '0.6.0' tag created a release
      # with no built installer because this workflow never ran for it.
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create venv and install Python deps
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -e ".[dev]"

      - name: Install frontend deps
        working-directory: frontend
        # ci installs exactly from the committed package-lock.json and fails if
        # package.json and the lockfile disagree — reproducible builds and no
        # silent dependency drift into the signed installer.
        run: npm ci

      - name: Build
        run: .\build.ps1

      # ── Code signing ─────────────────────────────────────────────────────
      # The app auto-starts at login, registers a global hotkey, and accesses
      # the microphone — exactly the profile SmartScreen/AV scrutinize. An
      # UNSIGNED installer will trip SmartScreen ("Unknown publisher") and is
      # more likely to be quarantined. Sign both the app exe AND the installer
      # with an Authenticode (ideally EV / Azure Trusted Signing) certificate.
      #
      # To enable: add the signing secrets to the repo and uncomment. Sign the
      # built exe BEFORE Inno packages it, then sign the installer after. With
      # Azure Trusted Signing, use azure/trusted-signing-action; for a PFX:
      #
      # - name: Sign app executable
      #   shell: pwsh
      #   env:
      #     CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
      #     CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
      #   run: |
      #     [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
      #     & signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       /f cert.pfx /p $env:CODE_SIGN_PFX_PASSWORD `
      #       "dist\VoiceTaskBoard\VoiceTaskBoard.exe"
      #     Remove-Item cert.pfx
      # NOTE: the exe must be signed before build.ps1 runs Inno Setup (move this
      # step accordingly), and the resulting installer signed the same way.

      - name: Verify installer was produced
        run: |
          if (-not (Test-Path "installer\output\VoiceTaskBoardSetup.exe")) {
            Write-Error "Installer was not produced"
            exit 1
          }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTaskBoardSetup
          path: installer/output/VoiceTaskBoardSetup.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/VoiceTaskBoardSetup.exe
          generate_release_notes: true
